services:
  db:
    # pgvector-enabled Postgres 16 — plain postgres:16-alpine has no vector
    # extension, so the RAG migration (CREATE EXTENSION vector, HNSW index
    # on KnowledgeChunk.embedding) would fail on every fresh deploy.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kilimo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kilimo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    # L'image de base ne télécharge aucun modèle : sans ce pull explicite, le
    # chat et le RAG échouent silencieusement au premier appel (404 Ollama).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull "$$OLLAMA_CHAT_MODEL" || true
        ollama pull "$$OLLAMA_EMBEDDING_MODEL" || true
        wait

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_min_32_chars_for_docker_1234567890}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@kilimo.org}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-KilimoAdmin2026!}
      DEFAULT_ADMIN_FULL_NAME: ${DEFAULT_ADMIN_FULL_NAME:-KILIMO Admin}
      DEFAULT_ADMIN_FORCE_RESET: ${DEFAULT_ADMIN_FORCE_RESET:-false}
      MONEYFUSION_API_URL: ${MONEYFUSION_API_URL:-https://pay.moneyfusion.net/Kilimo/}
      MONEYFUSION_TOKEN: ${MONEYFUSION_TOKEN}
      MONEYFUSION_NOTIF_URL: ${MONEYFUSION_NOTIF_URL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      DELIVERY_API_URL: ${DELIVERY_API_URL:-https://backend-lelivreur.up.railway.app}
      DELIVERY_API_PUBLIC_KEY: ${DELIVERY_API_PUBLIC_KEY}
      DELIVERY_API_SECRET_KEY: ${DELIVERY_API_SECRET_KEY}
      DELIVERY_PICK_ADDRESS_ID: ${DELIVERY_PICK_ADDRESS_ID}
      SERTIFIER_SECRET_KEY: ${SERTIFIER_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-KILIMO <onboarding@resend.dev>}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-50000}
      SHIPPING_BASE_FEE: ${SHIPPING_BASE_FEE:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kilimo}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SENTRY_DSN: ${SENTRY_DSN:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-secure_internal_token_change_in_production}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSIONS: ${OLLAMA_EMBEDDING_DIMENSIONS:-768}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      CHAT_DAILY_BUDGET: ${CHAT_DAILY_BUDGET:-50}
      CHAT_DAILY_PRO_BUDGET: ${CHAT_DAILY_PRO_BUDGET:-10}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_RETRIEVER_TOP_K: ${RAG_RETRIEVER_TOP_K:-5}
      RAG_RETRIEVER_SCORE_THRESHOLD: ${RAG_RETRIEVER_SCORE_THRESHOLD:-0.7}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./server/prisma:/app/prisma
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  db_data:
  uploads:
  ollama_data:
  redis_data:
