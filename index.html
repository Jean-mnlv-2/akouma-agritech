  <body translate="no">
    <div id="root">
      <!-- Splash screen brandé KILIMO - affiché avant le chargement de React -->
      <div id="splash-screen" style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f2b1a 0%, #1a3d2b 40%, #0d1f14 100%);
        font-family: system-ui, -apple-system, sans-serif;
      ">
        <img src="/logo-ak.png" alt="KILIMO" style="width: 100px; height: 100px; margin-bottom: 24px; animation: pulse-logo 2s ease-in-out infinite;" />
        <h1 style="color: #22c55e; font-size: 28px; font-weight: 700; letter-spacing: 2px; margin: 0 0 8px 0;">KILIMO</h1>
        <p style="color: #86efac; font-size: 14px; margin: 0 0 32px 0; opacity: 0.8;">L'avenir de l'agriculture intelligente</p>
        <div style="width: 48px; height: 48px; border: 3px solid rgba(34,197,94,0.2); border-top-color: #22c55e; border-radius: 50%; animation: spin-loader 0.8s linear infinite;"></div>
      </div>
      <style>
        @keyframes spin-loader { to { transform: rotate(360deg); } }
        @keyframes pulse-logo { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.85; } }
      </style>
    </div>
