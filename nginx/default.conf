server {
    listen 8080;
    server_name _;

    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to backend to avoid HTML responses and 405s
    location /api/ {
        # En production Render, ne pas utiliser resolver mais passer par le host direct
        # Docker utilise le nom de service 'backend', Render utilise une URL directe
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Configuration pour Render
        # Essayer d'abord le backend Docker, sinon fallback vers URL externe
        # Le resolver n'est pas nécessaire en production Render
        proxy_pass http://backend:4000;
        
        # Gestion des erreurs
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_fallback;
    }
    
    # Fallback pour Render si le backend Docker n'est pas accessible
    location @backend_fallback {
        return 302 https://akouma-backend.onrender.com$request_uri;
    }

    # Proxy auth API routes to backend while keeping SPA routes available
    location ~ ^/auth/(sign-in|sign-up|sign-out|session)$ {
        resolver 127.0.0.11 valid=30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:4000;
    }

    location /uploads/ {
        resolver 127.0.0.11 valid=30s;
        proxy_set_header Host $host;
        proxy_pass http://backend:4000$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
        set $csp_img_src "'self' data: blob: https:";
        set $csp_connect_src "'self' https:";
        
        # En développement, autoriser localhost
        if ($http_x_forwarded_proto = "http") {
            set $csp_img_src "'self' data: blob: http: https: http://localhost:*";
            set $csp_connect_src "'self' http://localhost:* https:";
        }
        
        # En production Render, autoriser le backend externe
        if ($host ~* "akouma.onrender.com") {
            set $csp_img_src "'self' data: blob: http: https: https://akouma-backend.onrender.com";
            set $csp_connect_src "'self' https: https://akouma-backend.onrender.com";
        }
        
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://translate.google.com https://translate.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; img-src $csp_img_src; font-src 'self' data: https://fonts.gstatic.com; connect-src $csp_connect_src; frame-ancestors 'self';" always;
    }

    location /.well-known/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
