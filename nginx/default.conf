server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Allow large file uploads (up to 100MB)
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Résolution DNS différée pour les blocs proxy_pass ci-dessous : avec un
    # upstream statique, nginx résout "backend" au chargement de la config et
    # refuse de démarrer si le nom n'existe pas (ex. déploiement Railway, où
    # le frontend appelle directement VITE_API_BASE_URL et ne passe jamais
    # par ces routes). Avec une variable, la résolution n'a lieu qu'à la
    # requête — identique en docker-compose (où "backend" résout via le DNS
    # embarqué de Docker), mais ne bloque plus le démarrage ailleurs.
    resolver 127.0.0.11 valid=30s;

    # Proxy API requests to backend (prioritize these routes!)
    location ^~ /api/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # RAG indexing (embeddings Ollama séquentiels) et le chat IA peuvent
        # dépasser largement le défaut nginx de 60s, surtout à froid.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /auth/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        set $backend_upstream http://backend:4000;
        proxy_pass $backend_upstream/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache index.html with no-cache to always get latest version
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
        # Also apply no-cache headers to index.html when served via fallback
        if ($uri = /index.html) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP restrictive (frame-ancestors ne fonctionne qu'en en-tête HTTP, pas en <meta>).
    # script-src n'inclut pas 'unsafe-inline' : le seul script du bundle est le
    # module compilé (chargé en <script type="module" src="...">), les blocs
    # JSON-LD sont des données inertes. Voir index.html pour le détail.
    # www.google.com + www.gstatic.com : chargement de reCAPTCHA v3
    # (useRecaptcha charge https://www.google.com/recaptcha/api.js, qui injecte
    # à son tour le bundle depuis gstatic) — sans ça le script est bloqué
    # silencieusement, aucun token n'est généré, et le backend rejette
    # sign-in/sign-up/dons avec "reCAPTCHA token missing".
    # https://www.googletagmanager.com ajouté à script-src (chargement du
    # conteneur GTM, cf. src/lib/consentGating.ts) et à frame-src (fallback
    # <noscript> statique dans index.html). Les appels réseau des tags GTM
    # (GA4, Conversion Linker) passent par connect-src, déjà couvert par le
    # wildcard "https:" ci-dessous — aucun ajout nécessaire là.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob: http://localhost:4000 http://127.0.0.1:4000; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: ws: wss: http://localhost:4000 http://127.0.0.1:4000; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://*.youtube.com https://www.google.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
}
