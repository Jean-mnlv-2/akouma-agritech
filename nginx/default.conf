server {
    listen 8080;
    server_name _;

    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to backend to avoid HTML responses and 405s
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:4000;
    }

    # Proxy auth API routes to backend while keeping SPA routes available
    location ~ ^/auth/(sign-in|sign-up|sign-out|session)$ {
        resolver 127.0.0.11 valid=30s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:4000;
    }

    location /uploads/ {
        resolver 127.0.0.11 valid=30s;
        proxy_set_header Host $host;
        proxy_pass http://backend:4000$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
        set $csp_img_src "'self' data: blob: http: https:";
        set $csp_connect_src "'self' https:";
        
        if ($http_x_forwarded_proto = "http") {
            set $csp_img_src "'self' data: blob: http: https: http://localhost:*";
            set $csp_connect_src "'self' http://localhost:* https:";
        }
        
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://translate.google.com https://translate.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com; img-src $csp_img_src; font-src 'self' data: https://fonts.gstatic.com; connect-src $csp_connect_src; frame-ancestors 'self';" always;
    }

    location /.well-known/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
