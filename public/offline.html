<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Hors ligne — KILIMO</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7faf7;
    color: #14251c;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1712; color: #eef5f0; }
  }
  .card { max-width: 26rem; }
  .icon {
    width: 4.5rem;
    height: 4.5rem;
    margin: 0 auto 1.25rem;
    border-radius: 9999px;
    background: rgba(34, 197, 94, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 2.25rem; height: 2.25rem; color: #16a34a; }
  h1 { font-size: 1.375rem; font-weight: 700; margin: 0 0 0.5rem; }
  p { font-size: 0.95rem; line-height: 1.5; opacity: 0.75; margin: 0 0 1.75rem; }
  button {
    appearance: none;
    border: none;
    border-radius: 9999px;
    padding: 0.75rem 1.75rem;
    font-size: 0.95rem;
    font-weight: 600;
    background: #16a34a;
    color: #fff;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M5 13a10 10 0 0 1 14 0" />
        <path d="M1.5 9.5a15 15 0 0 1 21 0" />
        <line x1="3" y1="3" x2="21" y2="21" />
      </svg>
    </div>
    <h1>Pas de connexion</h1>
    <p>Cette page n'est pas disponible hors ligne. Vérifiez votre connexion puis réessayez — le contenu déjà consulté reste accessible.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
