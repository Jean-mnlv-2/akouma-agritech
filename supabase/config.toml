# Configuration Supabase pour KILIMO Agritech
project_id = "bulmxkqueuizaznkhtmg"

# Configuration de la base de données
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600

[db]
port = 54322
shadow_port = 54320
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.admin-content]
verify_jwt = true

[functions.cart-management]
verify_jwt = false

[functions.form-submissions]
verify_jwt = false

[functions.auth-management]
verify_jwt = true
